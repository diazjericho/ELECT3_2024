<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyCaster: Weather Application</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
        crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
          crossorigin="anonymous"></script>
  <link href='https://fonts.googleapis.com/css?family=DM Sans' rel='stylesheet'>
</head>
<body style="font-family: 'DM Sans', sans-serif; background-color: #ffd1dc">
<div class="weather-container">
  <h1>SkyCaster: Weather Application</h1>
  <input type="text" id="cityInput" placeholder="Enter city name" />
  <button id="getWeatherButton" style="border-radius: 8px; margin-top: 8px">Get Weather</button>

  <div id="weatherResult" class="weather-result">
    <div class="row">
      <div class="col">
        <img id="weatherIcon" alt="Weather Icon" style="border-width: 100px; "/>
        <h3 id="condition"></h3>
        <h6 id="cityName"></h6>
        <h6 id="temperature"></h6>
      </div>
      <div class="col">
        <h4>Other details for this city:</h4>
        <h6 id="humidity"></h6>
        <h6 id="windSpeed"></h6>
        <h6 id="visibility"></h6>
        <h6 id="fullTemperature"></h6>
        <h6 id="sunrise"></h6>
        <h6 id="sunset"></h6>
      </div>
    </div>
  </div>

  <p id="errorMessage" class="error-message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
